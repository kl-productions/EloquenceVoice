# Builds an unsigned EloquenceVoice.ipa on a Mac runner, so no Mac of your own
# is needed. Sign and install it from Windows with Sideloadly.
name: ios

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages, space separated (enus engb eses esus frfr frca dede itit plpl)'
        default: 'enus'
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install make xcodegen

      - name: Build the engine
        env:
          OPENEVV_LANGS: ${{ inputs.languages || 'enus' }}
          MAKE: gmake
        run: bash scripts/build-openevv.sh

      # The same bridge the extension uses, driven the way the audio unit
      # drives it, on this Mac's own arm64 before anything is built for iOS.
      - name: Test the bridge on the Mac
        run: |
          set -eu
          cd Vendor/openevv
          gmake -j"$(sysctl -n hw.ncpu)" RULES=bytecode BUILD=build-host TRIM= CFLAGS=-g \
            build-host/libevv.a build-host/evv
          cc -g -O2 -std=gnu99 -w -Iinclude -Isrc/port -c lib/eci_api.c -o build-host/eci_api.o
          cc -g -O2 -std=gnu11 -Wall -Wextra -Iinclude -I../../Shared/Engine \
            ../../tests/bridge_test.c ../../Shared/Engine/elq_bridge.c \
            build-host/eci_api.o build-host/libevv.a -lpthread -lm -o build-host/bridge_test
          mkdir -p ../../test-wav

          # The engine's own command first: if this crashes too, the fault is
          # in the engine on Apple's arm64 rather than in the bridge.
          echo "== openevv's own evv on this Mac"
          if build-host/evv -o ../../test-wav/evv-command.wav "Hello from Eloquence."; then
            ls -l ../../test-wav/evv-command.wav
          else
            echo "evv failed with exit $?"
            lldb --batch -o run -k "thread backtrace all" -k quit -- \
              build-host/evv -o /tmp/evv.wav "Hello from Eloquence." || true
          fi

          echo "== the bridge test under the debugger"
          lldb --batch -o run -k "thread backtrace all" -k quit -- \
            build-host/bridge_test ../../test-wav || true

          echo "== the bridge test on its own"
          build-host/bridge_test ../../test-wav

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-test-recordings
          path: test-wav/
          if-no-files-found: ignore

      - name: Build the app
        run: |
          set -eu
          xcodegen generate
          xcodebuild -project EloquenceVoice.xcodeproj -scheme EloquenceVoice \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Pack the ipa
        run: |
          set -eu
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/EloquenceVoice.app Payload/
          ls Payload/EloquenceVoice.app/PlugIns
          zip -qry EloquenceVoice-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: EloquenceVoice-unsigned-ipa
          path: EloquenceVoice-unsigned.ipa
          if-no-files-found: error
