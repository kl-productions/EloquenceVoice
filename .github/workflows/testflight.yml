# Signs Eloquence Voice with your Apple developer account and uploads it to
# TestFlight for internal testers. Started by hand: Actions, testflight, Run
# workflow. README.md, "TestFlight", lists the one-time setup it needs:
#
#   variable APPLE_TEAM_ID                 your 10-character Team ID
#   secret   APP_STORE_CONNECT_KEY_ID      the API key's Key ID
#   secret   APP_STORE_CONNECT_ISSUER_ID   the Issuer ID above the key list
#   secret   APP_STORE_CONNECT_KEY_P8      the whole AuthKey_XXXXXXXXXX.p8 file
name: testflight

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages, space separated (enus engb eses esus frfr frca dede itit plpl)'
        default: 'enus'
        type: string

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      ARCHIVE: ${{ runner.temp }}/EloquenceVoice.xcarchive
      KEY_DIR: ${{ runner.temp }}/asc
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing settings are in place
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID (variable)"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing APP_STORE_CONNECT_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Not set yet:$missing. See README.md, TestFlight."
            exit 1
          fi

      - name: Tools
        run: brew install make xcodegen

      - name: Build the engine
        env:
          OPENEVV_LANGS: ${{ inputs.languages || 'enus' }}
          MAKE: gmake
        run: bash scripts/build-openevv.sh

      # The same bridge the extension uses, on this Mac's own arm64, so a
      # build that cannot speak never reaches your testers.
      - name: Test the bridge on the Mac
        run: |
          set -eu
          cd Vendor/openevv
          gmake -j"$(sysctl -n hw.ncpu)" RULES=bytecode BUILD=build-host TRIM= build-host/libevv.a
          cc -O2 -std=gnu99 -w -Iinclude -Isrc/port -c lib/eci_api.c -o build-host/eci_api.o
          cc -O2 -std=gnu11 -Wall -Wextra -Iinclude -I../../Shared/Engine \
            ../../tests/bridge_test.c ../../Shared/Engine/elq_bridge.c \
            build-host/eci_api.o build-host/libevv.a -lpthread -lm -o build-host/bridge_test
          build-host/bridge_test

      - name: Write the API key where Xcode can read it
        run: |
          set -eu
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$KEY_P8" > "$KEY_DIR/AuthKey_$KEY_ID.p8"
          chmod 600 "$KEY_DIR/AuthKey_$KEY_ID.p8"

      # Automatic signing through the API key creates or reuses the
      # distribution certificate and the profiles for the app and its
      # extension. Every run gets a higher build number, which TestFlight
      # requires.
      - name: Archive
        run: |
          set -eu
          xcodegen generate
          xcodebuild archive \
            -project EloquenceVoice.xcodeproj -scheme EloquenceVoice \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_DIR/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        run: |
          set -eu
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_DIR/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It appears in App Store Connect, TestFlight, once Apple finishes processing it."

      - name: Remove the API key
        if: always()
        run: rm -rf "$KEY_DIR"
