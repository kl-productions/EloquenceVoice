# XcodeGen project: `xcodegen generate` writes EloquenceVoice.xcodeproj.
# The Team ID is not kept here: the TestFlight workflow passes it in from the
# APPLE_TEAM_ID repository variable, and a local build picks it in Xcode.
#
# No App Group: the app reaches the extension's settings through the audio
# unit's message channel, as the eSpeak-NG app does, which also works when the
# app is signed with a free Apple ID.
name: EloquenceVoice
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    BUNDLE_ROOT: com.klproductions.eloquencevoice
    # The app and its extension must carry the same two versions. The
    # TestFlight workflow raises CURRENT_PROJECT_VERSION on every upload.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  EloquenceVoice:
    type: application
    platform: iOS
    sources:
      - App
      - Shared/Swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Eloquence Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Uses no encryption, so TestFlight does not ask on every build.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ROOT)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: EloquenceSynth
    scheme: {}

  EloquenceSynth:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - Shared/Swift
      - Shared/Engine
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Eloquence Synthesizer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The shape Apple's own speech synthesizer sample and the eSpeak-NG
        # app both ship with.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitFactory
          NSExtensionAttributes:
            AudioComponents:
              - name: "OpenEVV: Eloquence"
                description: Eloquence speech synthesizer
                manufacturer: OEVV
                subtype: elqn
                type: ausp
                version: 67072
                sandboxSafe: true
                tags:
                  - Speech Synthesizer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ROOT).synth
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Extension-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/openevv/include $(SRCROOT)/Shared/Engine
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) ECI_STATIC=1
    dependencies:
      - framework: Vendor/OpenEVV.xcframework
        embed: false
